# Single-scene Gaussian injection + standard nuScenes export.
# Machine paths come from local.yaml (dataset.root / inject_nusc.root).

run_id: gs01

dataset:
  root: ${NUSCENES_ROOT}          # overridden by local.yaml
  version: v1.0-mini
  scene: scene-0061
  lidar_channel: LIDAR_TOP
  cam_channels: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT,
                 CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

library:
  path: data/library

inject_nusc:
  root: ../nusc-inject            # read-only sibling (overridden by local.yaml)

mesh_points:
  n_dense: 60000                  # lidar payload sample cap per object
  n_lidar: 8000                   # per-object cap after occlusion

lidar_channel:
  range_image:
    H: 512
    W: 2048
    elev_min_deg: -30.67
    elev_max_deg: 10.67
  range_max_m: 80.0
  out_format: n5

camera_channel:
  frustum_margin_px: 40

composite:
  alpha_threshold: 0.05
  depth_margin_m: 0.2
  depth_margin_rel: 0.02

scene_occluders:
  enabled: true
  n_per_face: 64
  scale: 1.0
  max_dist_m: 60.0
  min_visibility: 1
  spacing_m: 0.15
  scene_gap_fill_deg: 0.7

# upstream validate.run reads this (blender self-check is a no-op on the
# gaussian path: cam_result.max_pixel_err = 0)
blender:
  selfcheck_max_pixel_err: 2.0

validation:
  min_coverage: 0.85
  min_bbox_iou: 0.5
  min_alpha_px: 500
  require_num_lidar_pts_gt0: true
  min_size_m: 0.05
  max_size_m: 40.0
  gauss_depth_vs_lidar_m: 0.5
  box_encloses_mask: 0.95
  ground_contact_max_m: 0.35   # bbox bottom vs robust local ground

# robust ground re-snap after anchor.build_gt (placement.py::resnap_ground):
# build_gt's fixed percentile floats objects when elevated clutter (parked
# truck) dominates the search circle; the resnap re-seats fresh placements
# on the low-tail ground estimate (frozen from_global poses are never touched).
ground_resnap:
  enabled: true
  radius_m: 6.0
  band_m: 0.4
  seed_pct: 2.0
  max_shift_m: 6.0        # confident ground-band estimate
  max_shift_weak_m: 0.3   # band fell back to neighbourhood median

annotation:
  category_name: movable_object.anomaly   # per-object category overrides this
  attribute_name: vehicle.moving
  visibility_token: "4"

objects:
  seed: 42
  count: 2
  tracking:
    count: 2
    length: [4, 8]
    # start farther and off-axis: a world-frozen target at 12 m is driven up
    # to within ~5 m inside a 5-frame window, which smears the silhouette
    # across half the frame and blows up gauss_depth_vs_lidar there. 24-36 m
    # keeps the whole 5-frame window outside the ego-target interchange zone.
    forward_range_m: [24.0, 36.0]
    lateral_range_m: [1.5, 5.0]
  ground:
    search_radius_m: 4.0
    z_percentile: 15.0

gaussian:
  render:
    backend: gsplat               # GPU (CUDA); falls back to cpu without gsplat
    ssaa: 2                       # supersampling factor (both backends)
  lidar:
    n_dense: 60000
    normal_knn: 16
    seed: 0
    pts_per_px_nominal: 0.02

output_dir: data/outputs
export_dir: data/exports

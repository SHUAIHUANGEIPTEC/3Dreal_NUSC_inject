# Asset library build: ingest 3DRealCar crops + Argoverse2 track clouds,
# normalize into the canonical frame, apply quality gates, write the manifest.

assets:
  root: ${ASSETS_ROOT}              # overridden by local.yaml
  realcar_dir: realcar_assets
  realcar_manifest: realcar_assets_manifest.json
  av2_dir: av2_assets/_merged
  av2_scene_dir: av2_assets

library:
  path: data/library

gates:
  realcar:
    grades: [A]
    l_range: [3.5, 6.5]
    w_range: [1.4, 2.6]
    h_range: [1.0, 2.0]
    min_texture_std: 5.0
    bbox_manifest_tol: 0.2
  av2:
    min_points: 300
    min_az_span_deg: 90.0
    min_pts_per_m2: 150.0
    min_coverage: 0.01
    completion_min_az_span_deg: 200.0

gaussian_init:
  mesh_samples: 120000
  mesh_scale_mul: 0.8
  point_scale_mul: 1.2
  knn: 8
  opacity_mesh: 0.9
  opacity_points: 0.85
  scale_range: [0.003, 0.15]
  color_mode: intensity
